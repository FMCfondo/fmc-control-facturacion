name: Mantener Supabase activo

# El plan Free de Supabase pausa el proyecto tras ~7 días sin actividad, y esta
# app se usa una vez al mes. Este ping semanal lo mantiene despierto.
#
# La URL del proyecto NO es secreta (viaja dentro de la app en el navegador), así
# que va aquí directa: una pieza menos que se pueda configurar mal.
# Solo se necesita UN secreto del repositorio (Settings → Secrets and variables →
# Actions → pestaña "Secrets" → New repository secret):
#   SUPABASE_ANON_KEY = la clave anon/public (Supabase → Settings → API)
env:
  SUPABASE_URL: https://sfgcbdaospsbjhxsifcf.supabase.co
  APP_URL: https://facturacion.fondomutuodecobertura.com

on:
  schedule:
    - cron: "0 13 * * 1"   # lunes 13:00 UTC (8:00 a. m. en Colombia)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico de la configuración
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "URL del proyecto: $SUPABASE_URL"
          if [ -z "$KEY" ]; then
            echo "::warning::El secreto SUPABASE_ANON_KEY no está configurado (o está vacío)."
            echo "Créalo en: Settings → Secrets and variables → Actions → pestaña 'Secrets' → New repository secret."
            echo "Ojo: debe estar en la pestaña ACTIONS, no en Dependabot ni Codespaces."
          else
            echo "Clave anon: configurada (${#KEY} caracteres)"
          fi

      - name: Consultar la base de datos
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Con RLS activo y sin políticas no devuelve datos, pero el request llega
          # al proyecto y cuenta como actividad (que es lo que evita la pausa).
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$SUPABASE_URL/rest/v1/parametros?select=clave&limit=1") || codigo="000"
          echo "Respuesta de Supabase: HTTP $codigo"
          case "$codigo" in
            000) echo "::error::Supabase no respondió. ¿El proyecto está pausado o la URL cambió?"; exit 1 ;;
            401) echo "::warning::HTTP 401 (clave ausente o inválida). El proyecto SÍ recibió el request y sigue despierto, pero conviene revisar el secreto." ;;
            *)   echo "Proyecto despierto y respondiendo." ;;
          esac

      - name: Despertar la aplicación
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL/login") || codigo="000"
          echo "Respuesta de la app: HTTP $codigo"
