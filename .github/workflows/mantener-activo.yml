name: Mantener Supabase activo

# El plan Free de Supabase pausa el proyecto tras ~7 días sin actividad, y esta
# app se usa una vez al mes. Este ping semanal lo mantiene despierto para que
# nunca lo encuentres dormido al entrar a facturar.
#
# REQUIERE dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<id-del-proyecto>.supabase.co
#   SUPABASE_ANON_KEY  la clave anon/public (Supabase → Settings → API)
on:
  schedule:
    - cron: "0 13 * * 1"   # lunes 13:00 UTC (8:00 a. m. en Colombia)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que los secretos existan
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          faltan=""
          [ -z "$URL" ] && faltan="$faltan SUPABASE_URL"
          [ -z "$KEY" ] && faltan="$faltan SUPABASE_ANON_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan estos secretos en el repositorio:$faltan"
            echo "Configúralos en Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "Secretos configurados correctamente."

      - name: Consultar la base de datos
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Consulta trivial. Con RLS activo y sin políticas no devuelve datos,
          # pero cuenta como actividad y evita que el proyecto se pause.
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "${URL%/}/rest/v1/parametros?select=clave&limit=1") || codigo="000"
          echo "Respuesta de Supabase: HTTP $codigo"
          if [ "$codigo" = "000" ]; then
            echo "::error::Supabase no respondió (¿el proyecto está pausado o la URL es incorrecta?)."
            exit 1
          fi
          echo "Proyecto despierto."

      - name: Despertar la aplicación
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://facturacion.fondomutuodecobertura.com/login) || codigo="000"
          echo "Respuesta de la app: HTTP $codigo"
