name: Mantener Supabase activo

# El plan Free de Supabase pausa el proyecto tras ~7 días sin actividad, y esta
# app se usa una vez al mes. Este ping semanal lo mantiene despierto para que
# nunca lo encuentres dormido al entrar a facturar.
on:
  schedule:
    - cron: "0 13 * * 1"   # lunes 13:00 UTC (8:00 a. m. en Colombia)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          # Consulta trivial (1 fila). Usa la clave pública (anon): con RLS activo
          # y sin políticas no devuelve datos, pero sí cuenta como actividad.
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/parametros?select=clave&limit=1")
          echo "Respuesta de Supabase: HTTP $codigo"
          # 200 y 401 son señal de que el proyecto está despierto y respondiendo.
          if [ "$codigo" = "000" ]; then
            echo "::error::Supabase no respondió: el proyecto podría estar pausado."
            exit 1
          fi

      - name: Despertar la aplicación
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" https://facturacion.fondomutuodecobertura.com/login)
          echo "Respuesta de la app: HTTP $codigo"
